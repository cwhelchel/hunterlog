[loggers]
keys=root

[logger_root]
handlers=file
level=DEBUG

[formatters]
keys=simple

[formatter_simple]
format=%(asctime)s = %(levelname)-7.7s [%(name)s]: %(message)s

[handlers]
keys=file,screen

[handler_file]
class=handlers.RotatingFileHandler
encoding='utf-8'
formatter=simple
level=DEBUG
args=(r'%(logfilename)s', 'a', 2097152, 5, 'utf-8') # 2MB rollover w/ 5 copies 

# %(logfilename)s is a placeholder. it is set in the code using 
# platformdirs.user_log_path + 'index.log'
# use a relative path like 'index.log' to put it in the current working dir

[handler_screen]
class=StreamHandler
formatter=simple
level=INFO
args=(sys.stdout,)