# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

# This is copied from the mac action (that works) and replaced runs-on to be windows
# currently just testing to see if it works.

name: Node.js Build Windows

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'DOIT'
        required: false
        type: boolean

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install env
      run: npm run init
    - name: Build Output
      run: npm run build

    - name: Sign windows output
      uses: dlemstra/code-sign-action@v1
      with:
        certificate: '${{ secrets.CERTIFICATE }}'
        password: '${{ secrets.PASSWORD }}'
        folder: 'dist'
        recursive: true
        
    - name: Setup NSIS
      uses: nsis-dev/setup-nsis@v1
      with:
        version: '3.13' # current as of Nov 2026

    - name: Build Windows Installer - makensis
      run: |
        makensis install/win.nsi

    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: hunterlog
        path: dist

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: hunterlog_installer
        path: install/Setup_Hunterlog.exe
        

